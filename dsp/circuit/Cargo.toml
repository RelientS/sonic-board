[package]
name = "sonic-board-circuit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "circuit-tool"
path = "src/bin/circuit-tool.rs"

[profile.release]
lto = "fat"
opt-level = 3
panic = "abort"
codegen-units = 1
